[project]
name = "langveyor"
version = "0.1.0"
description = "Multi-agent MES Root Cause Analysis (RCA) system built with LangGraph, PostgreSQL 17, and Qdrant hybrid RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "ddgs>=9.16.1",
    "langchain-core>=1.8.5",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-networkx>=3.6.1.20261126",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]
exclude = ["reference_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "ddgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
